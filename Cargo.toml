[package]
name = "greenlight"
version = "0.1.0"
edition = "2021"
description = "Human-supervised, artifact-driven step workflow harness"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tiktoken-rs = "0.12.1"

[dev-dependencies]
tempfile = "3"
