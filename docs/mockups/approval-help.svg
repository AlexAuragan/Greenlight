<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Read-only Help over a still-pending approval">
<title>Read-only Help over a still-pending approval</title>
<rect width="1200" height="820" fill="#111827"/>
<text x="24" y="27" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">DESIGN STUDY · SAMPLE DATA · NOT THE RUNNING APP</text>
<path d="M24 43h1152" stroke="#374151"/>
<text x="24" y="76" fill="#657086" font-family="DejaVu Sans Mono,monospace" font-size="18" font-weight="700" xml:space="preserve">Greenlight / bar-project</text>
<text x="24" y="105" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Investigate slow startup</text>
<text x="884" y="76" fill="#A18A48" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">● Decision pending</text>
<text x="24" y="153" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Activity   Artifacts   Edits</text>
<path d="M24 176h1152" stroke="#374151"/>
<text x="24" y="223" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="18" font-weight="700" xml:space="preserve">Your decision is needed</text>
<text x="24" y="280" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Recent activity</text>
<text x="24" y="329" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Read project instructions</text>
<text x="24" y="379" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Read src/bar.py</text>
<path d="M24 747h1152" stroke="#374151"/>
<text x="24" y="789" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Open selected     Compose     Stop requests     More</text>
<rect x="60" y="115" width="1080" height="606" rx="5" fill="#1F2937" stroke="#374151"/>
<text x="86" y="156" fill="#657086" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="700" xml:space="preserve">Shell permission required</text>
<text x="86" y="185" fill="#657086" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Bar startup investigation · bar-project</text>
<text x="86" y="628" fill="#657086" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Allow once · Y      Deny · N      This run · A</text>
<text x="86" y="673" fill="#657086" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Review project grant · P    Review global grant · G</text>
<rect x="185" y="205" width="830" height="405" rx="5" fill="#1F2937" stroke="#FBBF24"/>
<text x="211" y="246" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="700" xml:space="preserve">Help · shell approval</text>
<text x="211" y="275" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Read-only Help · the approval is still pending</text>
<path d="M211 293h778" stroke="#374151"/>
<text x="211" y="328" fill="#FBBF24" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="700" xml:space="preserve">No approval or grant choice is active while this window owns input.</text>
<text x="211" y="368" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Allow once covers the exact shown command. This run reuses it only in the current</text>
<text x="211" y="391" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">worker. Project/global review a saved grant.</text>
<text x="211" y="431" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Esc closes Help and returns to the still-valid approval. It does not deny the pending</text>
<text x="211" y="454" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">request from this window.</text>
<rect x="211" y="555" width="238" height="32" rx="3" fill="#1F2937" stroke="#67E8F9"/>
<text x="224" y="575" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Back to approval · Esc</text>
</svg>
