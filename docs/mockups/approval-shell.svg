<text x="24" y="379" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Read src/bar.py</text>
<path d="M24 747h1152" stroke="#374151"/>
<text x="24" y="789" fill="#566075" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Open selected     Compose     Stop requests     More</text>
<rect x="60" y="115" width="1080" height="606" rx="5" fill="#1F2937" stroke="#FBBF24"/>
<text x="86" y="156" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="700" xml:space="preserve">Shell permission required</text>
<text x="86" y="185" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Bar startup investigation · bar-project</text>
<path d="M86 203h1028" stroke="#374151"/>
<text x="86" y="236" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" xml:space="preserve">Exact command</text>
<rect x="86" y="249" width="1028" height="67" rx="3" fill="#111827" stroke="#67E8F9"/>
<text x="102" y="287" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" xml:space="preserve">systemctl --user status pure-black --no-pager -l | head -50</text>
<text x="86" y="358" fill="#FBBF24" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Allow once: this exact command, including arguments and operators.</text>
<text x="86" y="395" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">This run: reuse that exact-command approval in the current worker. Project/global choices open a separate</text>
<text x="86" y="418" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">persistent-grant confirmation.</text>
<text x="86" y="455" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Environment: read-only project, no network, private HOME. Approval does not add access to your host user services.</text>
<rect x="86" y="574" width="161" height="32" rx="3" fill="#1F2937" stroke="#67E8F9"/>
<text x="99" y="594" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Allow once · Y</text>
<rect x="259" y="574" width="103" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="272" y="594" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Deny · N</text>
<rect x="374" y="574" width="141" height="32" rx="3" fill="#1F2937" stroke="#FBBF24"/>
<text x="387" y="594" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">This run · A</text>
<rect x="527" y="574" width="103" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="540" y="594" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Help · h</text>
<rect x="86" y="620" width="257" height="32" rx="3" fill="#1F2937" stroke="#FBBF24"/>
<text x="99" y="640" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Review project grant · P</text>
<rect x="355" y="620" width="247" height="32" rx="3" fill="#1F2937" stroke="#FBBF24"/>
<text x="368" y="640" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Review global grant · G</text>
<text x="86" y="678" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">Explicit key or click decides. Enter does not decide.</text>
</svg>
