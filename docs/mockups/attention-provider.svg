<text x="1067" y="148" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Help h</text>
<path d="M24 176h1152" stroke="#374151"/>
<rect x="24" y="203" width="1152" height="119" rx="3" fill="#1F2937" stroke="#F87171"/>
<text x="44" y="234" fill="#F87171" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" xml:space="preserve">Attention required</text>
<text x="44" y="276" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="700" xml:space="preserve">Provider credentials rejected</text>
<text x="24" y="377" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Recorded cause</text>
<text x="24" y="408" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Authentication failed · HTTP 401. No automatic retry is scheduled.</text>
<text x="24" y="479" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Before resuming</text>
<text x="24" y="510" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Check the configured API-key environment variable outside this dialog.</text>
<text x="24" y="581" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Execution state</text>
<text x="24" y="612" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">The step is blocked. Existing files and artifacts remain available.</text>
<text x="24" y="709" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">Full evidence remains available. No action is retried just by opening this screen.</text>
