<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Attention-state design study: attention-write">
<title>Attention-state design study: attention-write</title>
<rect width="1200" height="820" fill="#111827"/>
<text x="24" y="27" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">DESIGN STUDY · SAMPLE DATA · NOT THE RUNNING APP</text>
<path d="M24 43h1152" stroke="#374151"/>
<text x="24" y="76" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="18" font-weight="700" xml:space="preserve">Greenlight / bar-project</text>
<text x="24" y="105" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Investigate slow startup</text>
<text x="745" y="76" fill="#F87171" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">● Write recovery required</text>
<text x="24" y="153" fill="#67E8F9" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Activity</text>
<path d="M24 162h79" stroke="#67E8F9"/>
<text x="129" y="153" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Artifacts</text>
<text x="257" y="153" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Edits</text>
<rect x="795" y="128" width="103" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="808" y="148" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Sessions</text>
<rect x="910" y="128" width="132" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="923" y="148" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Run details</text>
<rect x="1054" y="128" width="83" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="1067" y="148" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Help h</text>
<path d="M24 176h1152" stroke="#374151"/>
<rect x="24" y="203" width="1152" height="119" rx="3" fill="#1F2937" stroke="#F87171"/>
<text x="44" y="234" fill="#F87171" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" xml:space="preserve">Attention required</text>
<text x="44" y="276" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="700" xml:space="preserve">A native file write was interrupted</text>
<text x="24" y="377" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Unresolved workspace state</text>
<text x="24" y="408" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Do not assume the intended file change was fully applied or reverted.</text>
<text x="24" y="479" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Supported recovery path</text>
<text x="24" y="510" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Use the CLI recover-writes flow to inspect and reconcile the write.</text>
<text x="24" y="581" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="700" xml:space="preserve">Before continuing</text>
<text x="24" y="612" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Resume and restart stay unavailable until write recovery is resolved.</text>
<text x="24" y="709" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">Full evidence remains available. No action is retried just by opening this screen.</text>
<path d="M24 747h1152" stroke="#374151"/>
<rect x="24" y="769" width="238" height="32" rx="3" fill="#67E8F9" stroke="#67E8F9"/>
<text x="37" y="789" fill="#111827" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" xml:space="preserve">Open recovery guidance</text>
<rect x="274" y="769" width="180" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="287" y="789" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Inspect activity</text>
<rect x="466" y="769" width="64" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="479" y="789" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">More</text>
</svg>
