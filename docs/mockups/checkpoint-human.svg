<text x="104" y="331" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" xml:space="preserve">plan.md · exact selected input version</text>
<text x="104" y="373" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Show the window first; defer icon loading until after presentation.</text>
