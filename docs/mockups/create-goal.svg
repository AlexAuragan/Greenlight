<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="New session: goal editor">
<title>New session: goal editor</title>
<rect width="1200" height="820" fill="#111827"/>
<text x="24" y="27" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">DESIGN STUDY · SAMPLE DATA · NOT THE RUNNING APP</text>
<path d="M24 43h1152" stroke="#374151"/>
<text x="24" y="76" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="18" font-weight="700" xml:space="preserve">Greenlight / bar-project</text>
<text x="24" y="105" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Project workspace</text>
<rect x="1065" y="57" width="83" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="1078" y="77" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Help h</text>
<rect x="60" y="141" width="1080" height="594" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="84" y="185" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="700" xml:space="preserve">New session · Describe the goal</text>
<text x="84" y="218" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Workflow: Optimize performance · [Change workflow]</text>
<path d="M84 239h1032" stroke="#374151"/>
<text x="84" y="283" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="17" font-weight="700" xml:space="preserve">What should this workflow achieve?</text>
<rect x="84" y="305" width="1032" height="213" rx="3" fill="#111827" stroke="#67E8F9"/>
<text x="103" y="342" fill="#93C5FD" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">The bar takes about 30 seconds to appear.</text>
<text x="103" y="370" fill="#93C5FD" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">Investigate startup and propose a measured improvement.</text>
<text x="103" y="398" fill="#93C5FD" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" xml:space="preserve">You cannot access my host services; ask me for logs when needed.</text>
<rect x="700" y="382" width="2" height="23" rx="3" fill="#67E8F9"/>
<text x="84" y="559" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" xml:space="preserve">Start creates the session and launches its first step.</text>
<text x="84" y="589" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Tool approvals remain separate. No request is sent while you edit.</text>
<text x="84" y="625" fill="#94A3B8" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="400" xml:space="preserve">Enter starts · Alt+Enter adds a line · arrows move the caret</text>
<rect x="84" y="673" width="161" height="32" rx="3" fill="#67E8F9" stroke="#67E8F9"/>
<text x="97" y="693" fill="#111827" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="700" xml:space="preserve">Start workflow</text>
<rect x="257" y="673" width="64" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="270" y="693" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Back</text>
<rect x="333" y="673" width="83" height="32" rx="3" fill="#1F2937" stroke="#374151"/>
<text x="346" y="693" fill="#E5E7EB" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" xml:space="preserve">Cancel</text>
</svg>
